name: Sam Loc Reward Bot
on:
  # Chạy mỗi 6 giờ
  schedule:
    - cron: '0 */6 * * *'
  # Chạy thủ công
  workflow_dispatch:
    inputs:
      max_claims:
        description: 'Số lần claim tối đa'
        default: '15'
      cooldown:
        description: 'Cooldown giữa các claim (giây)'
        default: '3'

jobs:
  claim-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install playwright
          npx playwright install chromium --with-deps
      
      - name: Run reward bot
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          MAX_CLAIMS: ${{ github.event.inputs.max_claims || '15' }}
          COOLDOWN: ${{ github.event.inputs.cooldown || '3' }}
          HEADLESS: 'true'
          LOG_FILE: 'sam_reward_log.json'
        run: python3 sam_reward_bot_v2.py
      
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reward-log
          path: sam_reward_log.json
          retention-days: 30
