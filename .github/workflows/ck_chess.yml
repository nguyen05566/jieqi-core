name: ck_chess

# === CHẠY LIÊN TỤC, KHÔNG CÁCH KHOẢNG ===
# Bot cho Facebook Chess Online (game ID 194060244713436).
# Logic claim + transfer giống ck1 (continuous mode + Sam Loc reward flow).
# Cookie ck_chess.txt cho user "Bụi Nguyen" (c_user=100051928670915).
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ck-chess-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # max 6h trên GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright websocket-client
          playwright install chromium --with-deps

      - name: Run bot (with bash retry loop, ~5h50m)
        env:
          MAX_CLAIMS: '1'
          HEADLESS: 'true'
          COOLDOWN: '1'
          REST_BETWEEN_RUNS: '1'
          MAX_RUNTIME: '21000'
          TRANSFER_DEST_ID: '68307415'
          TRANSFER_ENABLED: 'true'
          SINGLE_COOKIE_FILE: 'ck_chess.txt'
        run: |
          set +e
          END_TIME=$(( $(date +%s) + ${MAX_RUNTIME} ))
          ATTEMPT=0
          while [ $(date +%s) -lt $END_TIME ]; do
            ATTEMPT=$((ATTEMPT+1))
            REMAIN=$(( END_TIME - $(date +%s) ))
            echo "=== [$(date '+%H:%M:%S')] Attempt #$ATTEMPT — $REMAIN s remaining ==="
            START=$(date +%s)
            python3 ck_chess.py
            EXIT=$?
            DUR=$(( $(date +%s) - START ))
            echo "=== [$(date '+%H:%M:%S')] Bot exited code=$EXIT after ${DUR}s ==="
            REMAIN=$(( END_TIME - $(date +%s) ))
            if [ $REMAIN -le 30 ]; then
              echo "Time up — stopping retry loop."
              break
            fi
            echo "Sleeping 60s before retry..."
            sleep 60
          done
          exit 0

      - name: Show log
        if: always()
        run: |
          echo "=== Bot log ==="
          cat loop.log 2>/dev/null || echo "(no log)"

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-chess
          path: /tmp/debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Auto-restart (continuous loop)
        if: false  # disabled — re-enable by setting back to 'always()'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          echo "Triggering next ck_chess run..."
          gh workflow run ck_chess.yml --ref "$GITHUB_REF" || echo "(restart failed)"
