name: Bot CK1

# Chạy thủ công hoặc định kỳ dự phòng mỗi 6 giờ
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: ck1-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Giới hạn tối đa 6h của GitHub Runner

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install playwright websocket-client
          playwright install chromium --with-deps

      - name: Run bot (with bash retry loop, ~5h50m under Xvfb)
        env:
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '1'
          MAX_RUNTIME: '21000'                  # 5h50m, chừa 10 phút buffer
          TRANSFER_DEST_ID: '70895360'
          TRANSFER_ENABLED: 'true'
          PRE_CLAIM_TRANSFER_THRESHOLD: '50000'
          MAX_CLAIMS_PER_DAY: '120'
          MAX_TRANSFERS_PER_DAY: '20'
          SESSION_START_JITTER: '180'
          IDLE_EVERY_CLAIMS: '40'
        run: |
          set +e
          END_TIME=$(( $(date +%s) + ${MAX_RUNTIME} ))
          ATTEMPT=0
          while [ $(date +%s) -lt $END_TIME ]; do
            ATTEMPT=$((ATTEMPT+1))
            REMAIN=$(( END_TIME - $(date +%s) ))
            echo "=== [$(date '+%H:%M:%S')] Attempt #$ATTEMPT — $REMAIN s remaining ==="
            START=$(date +%s)
            
            # Chạy qua xvfb-run để Playwright không bị lỗi hiển thị trên Linux
            xvfb-run --auto-servernum python3 ck1.py
            
            EXIT=$?
            DUR=$(( $(date +%s) - START ))
            echo "=== [$(date '+%H:%M:%S')] Bot exited code=$EXIT after ${DUR}s ==="
            
            REMAIN=$(( END_TIME - $(date +%s) ))
            if [ $REMAIN -le 30 ]; then
              echo "Time up — stopping retry loop."
              break
            fi
            echo "Sleeping 60s before retry..."
            sleep 60
          done
          exit 0

      - name: Show log
        if: always()
        run: |
          echo "=== Bot log ==="
          cat loop.log 2>/dev/null || echo "(no log)"

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/debug_*.png
          if-no-files-found: ignore
          retention-days: 7
