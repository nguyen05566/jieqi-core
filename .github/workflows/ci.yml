name: engine-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -j2 test
      - name: Build bot artifact
        run: ./scripts/build-linux.sh
      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: jieqi-core-linux-x86-64
          path: bin/jieqi-core
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ASan and UBSan
        run: make -j2 sanitize
