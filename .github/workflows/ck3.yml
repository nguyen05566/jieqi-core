name: ck3

# Trigger: every 2 hours OR manual dispatch
on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:  # manual button on GitHub Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 1 session ~5-10 min, give 30 min buffer
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright websocket-client
          playwright install chromium --with-deps

      - name: Run bot (1 session, 40 claims + transfer)
        env:
          MAX_CLAIMS: '40'
          HEADLESS: 'true'
          COOLDOWN: '3'
          REST_BETWEEN_RUNS: '5'
          MAX_RUNTIME: '10800'
          TRANSFER_DEST_ID: '49608454'
          TRANSFER_ENABLED: 'true'
        run: |
          python3 ck3.py

      - name: Show log
        if: always()
        run: |
          echo "=== Bot log ==="
          cat loop.log 2>/dev/null || echo "(no log)"
